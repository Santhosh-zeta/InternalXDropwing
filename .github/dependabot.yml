# Major upgrades are handled by hand (see the open 'help wanted' dependency issues).
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: pub
    directory: /mobile
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # These need a newer Flutter SDK than the pinned 3.35.5 or code migrations
      # (Riverpod 3, Freezed 4). Tracked in the "Upgrade Flutter" issue.
      - dependency-name: url_launcher
      - dependency-name: flutter_riverpod
      - dependency-name: riverpod_annotation
      - dependency-name: riverpod_generator
      - dependency-name: freezed
      - dependency-name: freezed_annotation
      - dependency-name: json_serializable
      - dependency-name: json_annotation
      - dependency-name: build_runner
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
