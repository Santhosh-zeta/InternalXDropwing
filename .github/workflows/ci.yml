name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Web · typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  backend:
    name: API · install, parse, boot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: internalx
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Dependency audit (production dependencies must stay at zero)
        working-directory: backend
        run: npm audit --omit=dev

      - name: Parse every source file
        working-directory: backend
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Apply schema, indexes and seed
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d internalx -v ON_ERROR_STOP=1 \
            -f deployment/postgres/init/01_schema.sql \
            -f deployment/postgres/init/02_indexes.sql \
            -f deployment/postgres/init/03_seed.sql

      - name: Init SQL must not seed any user account
        env:
          PGPASSWORD: postgres
        run: |
          n=$(psql -h localhost -U postgres -d internalx -tAc "SELECT count(*) FROM users")
          if [ "$n" != "0" ]; then
            echo "::error::init SQL created $n user(s); accounts come from the bootstrap admin only"
            exit 1
          fi

      - name: Migrations are idempotent on top of the init schema (upgrade path)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: internalx
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: npm run migrate && npm run migrate

      - name: Tests (data isolation matrix, chat, money)
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: internalx
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-only-not-a-real-secret
        run: npm test

      - name: Tables referenced by controllers must exist in the schema
        env:
          PGPASSWORD: postgres
        run: |
          # Guards against the class of bug where a controller queries a table
          # that only an ad-hoc migration script ever created, so a fresh
          # install from the documented path fails at runtime.
          status=0
          for t in task_assignees tasks users ventures access_levels projects \
                   timesheets documents messages notifications audit_logs okrs; do
            if [ -z "$(psql -h localhost -U postgres -d internalx -tAc \
                        "SELECT to_regclass('public.$t')")" ]; then
              echo "::error::table '$t' is queried by backend/src but missing from the init schema"
              status=1
            fi
          done
          exit $status

      - name: Boot the server on an EMPTY database (AUTO_MIGRATE) and hit /api/health + /api/ready
        working-directory: backend
        env:
          NODE_ENV: development
          PORT: '5000'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: internalx_boot
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci-only-not-a-real-secret
          FRONTEND_URL: http://localhost:3000
          BOOTSTRAP_ADMIN_EMAIL: ci-admin@dropwinggroups.com
          BOOTSTRAP_ADMIN_PASSWORD: Ci-Boot-9xQ!vT4mLz2
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE internalx_boot'
          node src/server.js &
          curl -sSf --retry 20 --retry-all-errors --retry-delay 1 \
            http://localhost:5000/api/health
          echo
          curl -sSf http://localhost:5000/api/ready
          echo
          # the bootstrap admin must have been created on first boot
          sleep 2
          n=$(PGPASSWORD=postgres psql -h localhost -U postgres -d internalx_boot -tAc \
                "SELECT count(*) FROM users WHERE access_level = 1")
          [ "$n" = "1" ] || { echo "::error::bootstrap admin was not created"; exit 1; }

  backend-tests:
    name: API · jest + supertest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: internalx_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Test
        working-directory: backend
        env:
          # The suite DROPs and recreates the public schema, then applies
          # deployment/postgres/init/*.sql. Never point this at real data.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/internalx_test
        run: npm test

  mobile:
    name: Mobile · analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: |
          # The app must COMPILE. Info-level lints are reported but do not fail
          # the build; a hard error means the app cannot be built at all, which
          # has shipped to main before and must never happen again.
          flutter analyze --no-fatal-infos --no-fatal-warnings

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No credentials in tracked files
        run: |
          # Deliberately narrow: assignments with a long literal value, plus a
          # few provider-specific prefixes. Templates and placeholders pass.
          if git grep -nIE \
               -e '(PASSWORD|PASSWD|SECRET|TOKEN|API_?KEY)[[:space:]]*=[[:space:]]*["'"'"']?[A-Za-z0-9@#$%^&*_+-]{12,}' \
               -e 'GOCSPX-[A-Za-z0-9_-]{10,}' \
               -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
               -- ':!*.lock' ':!*package-lock.json' ':!*.github/workflows/*' \
             | grep -viE 'change_me|your_|generate_|replace_|example|placeholder|dummy|sample|xxx+|secret_key|random|<[A-Za-z_]+>|\$\{'; then
            echo "::error::a credential-shaped literal is committed — remove it and rotate the value"
            exit 1
          fi
          echo "No credentials found in tracked files."

      - name: No .env file is tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "::error::an .env file is tracked"
            exit 1
          fi
          echo "No tracked .env files."
