version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dgos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-internalx}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount initialization scripts (optional)
      # - ./C_PostgreSQL_Schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      # - ./D_PostgreSQL_Indexes.sql:/docker-entrypoint-initdb.d/2_indexes.sql
      # - ./postgres_seed.sql:/docker-entrypoint-initdb.d/3_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
