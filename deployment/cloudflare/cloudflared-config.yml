# Cloudflare Tunnel in front of InternalX. One origin serves the web app, the API,
# Socket.IO and uploads, so a single ingress rule is enough (WebSockets pass through).
#
#   cloudflared tunnel create internalx
#   cloudflared tunnel route dns internalx internalx.example.com
#   cp cloudflared-config.yml /etc/cloudflared/config.yml     # fill in the two placeholders
#   cloudflared service install
#
# In the app's .env:  PUBLIC_URL=https://internalx.example.com   TRUST_PROXY=1
# (the tunnel is exactly one proxy hop in front of the app)

tunnel: internalx
credentials-file: /etc/cloudflared/<TUNNEL_UUID>.json

ingress:
  - hostname: internalx.example.com
    service: http://127.0.0.1:5000
    originRequest:
      connectTimeout: 30s
  - service: http_status:404
