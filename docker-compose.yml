# Production stack: the InternalX app (API + web) and PostgreSQL 16.
#
#   cp deployment/production-env.example .env      # then fill EVERY value in
#   docker compose up -d --build
#
# * No default passwords: compose refuses to start until the secrets are set in .env.
# * Data lives in two named volumes: `pgdata` (database) and `uploads` (documents, avatars).
#   Back them up (deployment/backup/) and never `docker compose down -v` in production.
# * The app listens on 127.0.0.1 only. Put a TLS-terminating reverse proxy in front
#   (Caddy, nginx, Cloudflare Tunnel) and set TRUST_PROXY=1 in .env.
# * The database is not published to the host at all.
# * Schema: an empty database is fully built by the backend's migrations at boot
#   (AUTO_MIGRATE), so no init scripts are mounted. See docs/production-checklist.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-internalx}
      POSTGRES_DB: ${POSTGRES_DB:-internalx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    build:
      context: .
      args:
        # Public origin of the app, inlined into the web bundle at build time.
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env, e.g. https://internalx.example.com}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    image: internalx:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      FRONTEND_URL: ${PUBLIC_URL}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-internalx}
      DB_USER: ${POSTGRES_USER:-internalx}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-5000}:5000"
    volumes:
      - uploads:/app/uploads
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  pgdata:
  uploads:
